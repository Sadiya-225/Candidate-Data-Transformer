[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-transformer"
version = "0.1.0"
description = "Multi-Source Candidate Data Transformer - normalize and merge candidate profiles from multiple sources"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Candidate Transformer Team" }
]
dependencies = [
    "pydantic>=2.0,<3",
    "phonenumbers>=8.13",
    "pycountry>=23.12",
    "python-dateutil>=2.8",
    "pdfplumber>=0.10",
    "python-docx>=0.8",
    "requests>=2.31",
    "click>=8.1",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "mypy>=1.7",
    "ruff>=0.1",
]

[project.scripts]
transformer = "transformer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
